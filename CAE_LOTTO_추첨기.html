<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAE LOTTO | 실물기계형 추첨</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#f8fafc;background:#08111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#253750,#08111f 75%);min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:2px;color:#b6c6d9}.brand{font-size:clamp(28px,4vw,48px);font-weight:1000;letter-spacing:-1.5px}.brand b{color:#ff8527}.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:14px}.machine{position:relative;min-height:620px;border:1px solid #38516b;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#30475b,#101d2d 62%,#09111d);box-shadow:inset 0 0 55px #0007}.machine canvas{display:block;width:100%;height:620px}.machine .tag{position:absolute;top:18px;left:20px;font-size:12px;letter-spacing:2px;color:#c4d2df}.side{border:1px solid #38516b;background:#142236;border-radius:24px;padding:22px;display:flex;flex-direction:column}.side h2{margin:0 0 6px;font-size:23px}.count{font-size:13px;color:#ffb474;margin-bottom:20px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;max-height:290px;overflow:auto;padding:3px}.slot{border:2px dashed #586a7f;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:24px;color:#8a9aae}.slot.on{background:radial-gradient(circle at 30% 20%,#fff2bb,#ff8c30 70%);border:2px solid #fff8;color:#182132;box-shadow:0 5px 16px #ff8c3035}.slot.bonus{border-color:#69d5ff}.status{margin:20px 0 10px;min-height:70px;line-height:1.6;color:#e2e9f2}.buttons{display:grid;gap:10px;margin-top:auto}button{padding:16px;border:0;border-radius:12px;background:#ff8527;color:#161d2a;font-size:17px;font-weight:900;cursor:pointer}button.secondary{background:#30425a;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.note{color:#92a6ba;font-size:12px;line-height:1.6;text-align:center;margin:18px 0 0}.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle,#ffb34724,transparent 60%)}.flash.show{opacity:1}.flash .number{width:min(34vw,190px);height:min(34vw,190px);border-radius:50%;background:radial-gradient(circle at 30% 23%,#fff5ce,#ff8b28 70%);border:7px solid #fff9;box-shadow:0 0 0 18px #ff8c2525,0 20px 80px #000b;display:grid;place-items:center;color:#192131;font-size:clamp(58px,9vw,100px);font-weight:1000;animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.35)}to{transform:scale(1)}}@media(max-width:850px){.stage{grid-template-columns:1fr}.machine,.machine canvas{min-height:0;height:510px}.side{min-height:0}.result{grid-template-columns:repeat(6,1fr)}.slot{font-size:18px}.buttons{grid-template-columns:1fr 1fr}}@media(max-width:480px){.wrap{padding:10px}.machine,.machine canvas{height:400px}.result{grid-template-columns:repeat(3,1fr)}.buttons{grid-template-columns:1fr}.side{padding:16px}}@media(prefers-reduced-motion:reduce){.flash .number{animation:none}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">HANKOOK TIRE & TECHNOLOGY · CAE EVENT</div><div class="brand">CAE <b>LOTTO</b> 🎱</div><div class="eyebrow">제1회 · 해석기술연구팀 커피내기</div></div><button class="secondary" id="full">⛶ 전체화면</button></header><section class="stage"><div class="machine"><div class="tag">LOTTERY DRAW MACHINE · LIVE</div><canvas id="scene" aria-label="투명 구형 추첨기에서 공들이 섞이고 선택된 공이 굴곡진 관을 따라 내려옵니다"></canvas><div class="flash" id="flash"><div class="number" id="big">?</div></div></div><aside class="side"><h2>🏆 추첨 번호</h2><div class="count" id="count">0개 추첨 · 20개 남음</div><div class="result" id="result"></div><div class="status" id="status" aria-live="polite">공이 섞이고 있어요! 버튼을 누르면 공 하나가 관을 따라 굴러 나옵니다.</div><div class="buttons"><button id="draw">🎱 번호 하나 추첨</button><button class="secondary" id="reset">↻ 처음부터 다시</button></div><p class="note">1~20 · 중복 없는 추첨 · 6개 이후 동점자용 추가 추첨 가능<br>최대 20개 · 별도 설치 및 인터넷 연결 불필요</p></aside></section></main><script>
(()=>{'use strict';const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),draw=document.getElementById('draw'),reset=document.getElementById('reset'),result=document.getElementById('result'),status=document.getElementById('status'),count=document.getElementById('count'),flash=document.getElementById('flash'),big=document.getElementById('big');let W=700,H=620,balls=[],chosen=[],busy=false,phase='mix',picked=null,phaseStart=0,generation=0,last=0,raf=0;const colors=['#ff923b','#ffd05b','#68c8ed','#79d5ad','#b6a3ef','#f28ca6'];function rng(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}function resize(){const rect=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}function geom(){const s=Math.min(W/690,H/620),cx=W*.47,cy=H*.385,R=Math.min(W*.31,H*.31),br=Math.max(10,Math.min(17,R*.093));return{s,cx,cy,R,br,portX:cx+R*.36,portY:cy+R*.90,exitX:W*.73,exitY:H*.84}}function create(){generation++;balls=[];chosen=[];busy=false;phase='mix';picked=null;flash.classList.remove('show');for(let n=1;n<=20;n++){let a=n*2.39996,r=Math.sqrt((n-.4)/20)*.77;balls.push({n,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:(Math.random()-.5)*.55,vy:(Math.random()-.5)*.55,alive:true,color:colors[(n-1)%colors.length]})}renderResult();status.textContent='공이 섞이고 있어요! 버튼을 누르면 공 하나가 관을 따라 굴러 나옵니다.';draw.disabled=false;draw.textContent='🎱 번호 하나 추첨'}function renderResult(){result.replaceChildren();for(let i=0;i<Math.max(6,chosen.length);i++){const e=document.createElement('div');e.className='slot'+(i<chosen.length?' on':'')+(i>=6?' bonus':'');e.textContent=i<chosen.length?String(chosen[i]).padStart(2,'0'):'?';result.append(e)}count.textContent=`${chosen.length}개 추첨 · ${20-chosen.length}개 남음`;draw.disabled=busy||chosen.length===20;draw.textContent=busy?'⏳ 추첨 진행 중...':chosen.length===20?'✓ 모든 번호 추첨 완료':'🎱 번호 하나 추첨'}function line(x1,y1,x2,y2,stroke,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}function round(x,y,r,fill,stroke,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}function tubePath(g){const{x:dummy}=g;const p=new Path2D();p.moveTo(g.portX,g.portY);p.bezierCurveTo(g.portX+20*g.s,g.portY+70*g.s,g.cx+g.R*.95,g.cy+g.R+55*g.s,g.cx+g.R*.70,g.cy+g.R+100*g.s);p.bezierCurveTo(g.cx+g.R*.35,g.cy+g.R+155*g.s,g.exitX-115*g.s,g.exitY-115*g.s,g.exitX-75*g.s,g.exitY-55*g.s);p.bezierCurveTo(g.exitX-35*g.s,g.exitY-15*g.s,g.exitX-40*g.s,g.exitY,g.exitX,g.exitY);return p}function bez(a,b,c,d,t){const k=1-t;return k*k*k*a+3*k*k*t*b+3*k*t*t*c+t*t*t*d}function tubePoint(g,t){const p0=[g.portX,g.portY],p1=[g.portX+20*g.s,g.portY+70*g.s],p2=[g.cx+g.R*.95,g.cy+g.R+55*g.s],p3=[g.cx+g.R*.70,g.cy+g.R+100*g.s],q1=[g.cx+g.R*.35,g.cy+g.R+155*g.s],q2=[g.exitX-115*g.s,g.exitY-115*g.s],q3=[g.exitX-75*g.s,g.exitY-55*g.s],r1=[g.exitX-35*g.s,g.exitY-15*g.s],r2=[g.exitX-40*g.s,g.exitY],r3=[g.exitX,g.exitY];if(t<.4){let u=t/.4;return[bez(p0[0],p1[0],p2[0],p3[0],u),bez(p0[1],p1[1],p2[1],p3[1],u)]}if(t<.78){let u=(t-.4)/.38;return[bez(p3[0],q1[0],q2[0],q3[0],u),bez(p3[1],q1[1],q2[1],q3[1],u)]}let u=(t-.78)/.22;return[bez(q3[0],r1[0],r2[0],r3[0],u),bez(q3[1],r1[1],r2[1],r3[1],u)]}function paintBall(x,y,r,b,shine=true){const gr=ctx.createRadialGradient(x-r*.38,y-r*.45,1,x,y,r);gr.addColorStop(0,'#fff7');gr.addColorStop(.22,b.color);gr.addColorStop(1,'#172333');ctx.shadowColor='#0009';ctx.shadowBlur=8;ctx.shadowOffsetY=4;round(x,y,r,gr,'#ffffffa8',1.5);ctx.shadowBlur=0;ctx.shadowOffsetY=0;if(shine)round(x-r*.29,y-r*.35,r*.19,'#fff8');ctx.fillStyle='#152132';ctx.font=`900 ${Math.max(10,r*.91)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(b.n).padStart(2,'0'),x,y+1)}function drawScene(t){ctx.clearRect(0,0,W,H);const g=geom(),{cx,cy,R,br,s}=g;const ground=H*.91;ctx.fillStyle='#182c45';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#294866';ctx.fillRect(W*.19,ground-8,W*.57,12);ctx.fillStyle='#ff8527';ctx.fillRect(W*.25,ground+4,W*.43,6);line(cx,cy+R-4,cx,ground-8,'#7594ac',13*s);line(cx-78*s,ground-8,cx+78*s,ground-8,'#536e89',16*s);const tube=tubePath(g);ctx.strokeStyle='#142537';ctx.lineWidth=30*s;ctx.lineCap='round';ctx.stroke(tube);ctx.strokeStyle='#9db8cbb0';ctx.lineWidth=24*s;ctx.stroke(tube);ctx.strokeStyle='#d5f5ff77';ctx.lineWidth=17*s;ctx.stroke(tube);ctx.strokeStyle='#1a30449a';ctx.lineWidth=13*s;ctx.stroke(tube);const glass=ctx.createRadialGradient(cx-R*.33,cy-R*.5,5,cx,cy,R);glass.addColorStop(0,'#d9f7ff29');glass.addColorStop(.55,'#8ac4f311');glass.addColorStop(1,'#050d1b8c');round(cx,cy,R,glass,'#b8d9e6',6*s);ctx.save();ctx.beginPath();ctx.arc(cx,cy,R-5*s,0,Math.PI*2);ctx.clip();for(const b of balls){if(!b.alive||b===picked&&phase==='roll')continue;paintBall(cx+b.x*(R-br-12*s),cy+b.y*(R-br-12*s),br,b)}ctx.restore();ctx.beginPath();ctx.ellipse(cx-R*.34,cy-R*.4,R*.45,R*.15,-.6,0,Math.PI*2);ctx.strokeStyle='#ffffff42';ctx.lineWidth=11*s;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,R-12*s,Math.PI*.72,Math.PI*1.2);ctx.strokeStyle='#ffffff3a';ctx.lineWidth=7*s;ctx.stroke();round(g.portX,g.portY,br*1.15,'#172739','#ffae63',3*s);if(phase==='roll'&&picked){const p=Math.min(1,(t-phaseStart)/2500),ease=p<.1?p*.5:p<.86?.05+(p-.1)*1.13:.91+(p-.86)*.643;const [x,y]=tubePoint(g,Math.min(1,ease));paintBall(x,y,br*1.13,picked);if(p>=1){phase='reveal';phaseStart=t;chosen.push(picked.n);big.textContent=String(picked.n).padStart(2,'0');flash.classList.add('show');renderResult();status.textContent=`🎉 ${chosen.length}번째${chosen.length>6?' 추가':''} 번호는 ${String(picked.n).padStart(2,'0')}번!`;}}if(phase==='reveal'&&t-phaseStart>1700){flash.classList.remove('show');phase='mix';picked=null;busy=false;renderResult();if(chosen.length===20)status.textContent='모든 번호 추첨 완료! 초기화하면 다시 시작할 수 있어요.';else if(chosen.length>=6)status.textContent='기본 6개 완료! 동점자 발생 시 추가 추첨을 계속하세요.';else status.textContent='다음 번호도 추첨할 수 있어요.'}ctx.fillStyle='#d7e7f1';ctx.font=`700 ${Math.max(11,13*s)}px system-ui`;ctx.textAlign='center';ctx.fillText('CAE LOTTO',cx,ground+30*s)}function move(dt,t){const energy=phase==='anticipation'?2.7:1;const active=balls.filter(b=>b.alive);for(const b of active){b.vx+=(Math.random()-.5)*dt*2.8*energy;b.vy+=(Math.random()-.5)*dt*2.8*energy;const sp=Math.hypot(b.vx,b.vy);if(sp>.95*energy){b.vx*=.95*energy/sp;b.vy*=.95*energy/sp}b.x+=b.vx*dt;b.y+=b.vy*dt;const d=Math.hypot(b.x,b.y),lim=.85;if(d>lim){let nx=b.x/d,ny=b.y/d,dot=b.vx*nx+b.vy*ny;b.x=nx*lim;b.y=ny*lim;b.vx-=1.85*dot*nx;b.vy-=1.85*dot*ny}}for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){const a=active[i],b=active[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<.17){const nx=dx/d,ny=dy/d,ov=(.17-d)*.5;a.x-=nx*ov;b.x+=nx*ov;a.y-=ny*ov;b.y+=ny*ov;const v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(v>0){a.vx-=v*nx*.8;a.vy-=v*ny*.8;b.vx+=v*nx*.8;b.vy+=v*ny*.8}}}}function loop(t){const dt=Math.min((t-last||16)/1000,.04);last=t;move(dt,t);if(phase==='anticipation'&&t-phaseStart>2100){phase='roll';phaseStart=t;picked.alive=false;status.textContent='🎱 선택된 공이 출구로 나왔어요! 관을 따라 데구르르...'}drawScene(t);raf=requestAnimationFrame(loop)}function pick(){if(busy||chosen.length===20)return;const pool=balls.filter(b=>b.alive);if(!pool.length)return;busy=true;picked=pool[rng(pool.length)];phase='anticipation';phaseStart=performance.now();for(const b of pool){b.vx+=(Math.random()-.5)*1.2;b.vy+=(Math.random()-.5)*1.2}status.textContent='🥁 공을 빠르게 섞는 중... 어떤 번호가 나올까요?';renderResult()}draw.addEventListener('click',pick);reset.addEventListener('click',create);document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('전체화면을 사용할 수 없습니다.')}});window.addEventListener('resize',resize);resize();create();raf=requestAnimationFrame(loop)})();
